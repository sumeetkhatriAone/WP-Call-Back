<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Auctions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .modal-content { border-radius: 10px; border: none; box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .auction-header { font-weight: 900; font-size: 1.4rem; color: #333; margin-bottom: 1.5rem; line-height: 1.4; }
        
        .auction-list-container {
            max-height: 300px; overflow-y: auto;
            border: 2px solid #e0e0e0; border-radius: 8px;
            padding: 20px; background-color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        
        .form-check { margin-bottom: 15px; padding-left: 2em; }
        .form-check-input { cursor: pointer; transform: scale(1.2); }
        .form-check-label { cursor: pointer; font-size: 1rem; margin-left: 5px; }
        .auction-id { font-weight: bold; color: #0d6efd; display: inline-block; min-width: 100px; }
        
        .success-container { text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 4rem; color: #198754; margin-bottom: 20px; }
        .success-text { font-size: 1.2rem; font-weight: 500; color: #333; margin-bottom: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">Auction Portal</span>
        <div class="d-flex text-white align-items-center">
            <span class="me-3">Welcome, User</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="modal fade show" id="auctionModal" tabindex="-1" style="display: block; background-color: rgba(0,0,0,0.6);" aria-modal="true" role="dialog">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-5">
                    
                    <!-- Form View -->
                    <div id="formView">
                        <div class="auction-header text-center">
                            Please select the auction you are interested in:
                        </div>

                        <!-- Error Message -->
                        <div id="selectionError" class="alert alert-warning d-none" role="alert">
                            Please select at least one auction.
                        </div>

                        <form onsubmit="handleAuctionSubmit(event)">
                            <div class="auction-list-container mb-4" id="auctionList">
                                <!-- JavaScript will populate this list -->
                            </div>

                            <div class="d-flex justify-content-end border-top pt-3">
                                <button type="submit" class="btn btn-primary px-4 py-2">
                                    <i class="bi bi-check-circle me-1"></i> Submit Selection
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Success View (Hidden by default) -->
                    <div id="successView" class="success-container d-none">
                        <i class="bi bi-check-circle-fill success-icon"></i>
                        <div class="success-text">Your interest has been submitted.</div>
                        <div class="text-muted">We will connect with you shortly.</div>
                        
                        <div class="mt-5 border-top pt-4">
                            <a href="index.html" class="btn btn-primary px-4 py-2">Close & Logout</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
